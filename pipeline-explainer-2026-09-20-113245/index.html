<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050b0a; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* ── Background / depth layer ─────────────────────── */
      #bg { position: absolute; inset: 0; overflow: hidden; }
      #glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(1000px 560px at 50% 28%, rgba(16, 185, 129, 0.20), transparent 62%),
          radial-gradient(760px 460px at 82% 70%, rgba(14, 165, 233, 0.10), transparent 60%),
          radial-gradient(700px 420px at 14% 78%, rgba(124, 58, 237, 0.08), transparent 60%);
      }
      #veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,11,10,0.5) 0%, rgba(5,11,10,0) 40%, rgba(5,11,10,0.55) 100%); }

      /* ── Intro (top) ──────────────────────────────────── */
      #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 96px; }
      #eyebrow { color: #34d399; font-size: 26px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
      #title { color: #ffffff; font-size: 92px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.06; margin-top: 20px; }
      .gradient-text {
        background: linear-gradient(90deg, #34d399 0%, #2dd4bf 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #subtitle { color: rgba(255,255,255,0.66); font-size: 30px; margin-top: 22px; font-weight: 400; }

      /* ── Layer wrappers (full-frame clips) ────────────── */
      #bg, #stage-area, #track-area { position: absolute; inset: 0; overflow: hidden; }

      /* ── Stage card (swaps per station) ───────────────── */
      #stage-card {
        position: absolute; top: 370px; left: 50%; transform: translateX(-50%);
        width: 1060px; min-height: 200px; text-align: center;
      }
      #stage-name { color: #ffffff; font-size: 58px; font-weight: 800; letter-spacing: -0.01em; }
      #stage-verb { color: rgba(255,255,255,0.66); font-size: 30px; font-weight: 500; margin-top: 6px; }
      #stage-output {
        display: inline-block; margin-top: 26px; padding: 14px 34px; border-radius: 999px;
        background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(52, 211, 153, 0.45);
        color: #34d399; font-size: 32px; font-weight: 700; letter-spacing: 0.01em;
      }

      /* ── Track + stations ─────────────────────────────── */
      #track { position: absolute; top: 812px; left: 130px; width: 1660px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14); }
      #track-fill {
        position: absolute; top: 812px; left: 130px; width: 0px; height: 4px; border-radius: 2px;
        background: linear-gradient(90deg, rgba(52,211,153,0.35), #34d399);
      }
      .station {
        position: absolute; top: 780px; width: 64px; height: 64px; margin-left: -32px;
        z-index: 3;
        border-radius: 50%; background: rgba(255,255,255,0.05);
        border: 2px solid rgba(255,255,255,0.22);
        display: flex; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.55); font-size: 24px; font-weight: 700; font-family: Inter, system-ui, sans-serif;
      }
      .station.done { border-color: rgba(52,211,153,0.7); background: rgba(52,211,153,0.18); color: #6ee7b7; }
      .station.active { border-color: #34d399; background: rgba(52,211,153,0.30); color: #ffffff; box-shadow: 0 0 32px rgba(52,211,153,0.5); }

      /* ── The package ──────────────────────────────────── */
      #package {
        position: absolute; top: 762px; left: 0; width: 168px; height: 56px; margin-left: -84px;
        z-index: 2;
        border-radius: 12px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f766e 0%, #052e22 100%);
        border: 1px solid rgba(52,211,153,0.6);
        color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
        box-shadow: 0 0 28px rgba(16,185,129,0.45);
      }

      /* ── Outro ────────────────────────────────────────── */
      #outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      #outro-claim { color: #ffffff; font-size: 66px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; }
      #outro-mark { margin-top: 40px; font-size: 58px; font-weight: 800; letter-spacing: 0.01em; }
      #outro-tag { color: #34d399; font-size: 26px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="23.5">

      <!-- Background layer (full scene) -->
      <div id="bg" class="clip" data-start="0" data-duration="23.5" data-track-index="0">
        <div id="glow"></div>
        <div id="veil"></div>
      </div>

      <!-- Intro -->
      <div id="intro" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div id="eyebrow">The Content Engine</div>
        <div id="title">One topic in.<br /><span class="gradient-text">A citable article out.</span></div>
        <div id="subtitle">Seven stages. One handoff each. Every claim sourced.</div>
      </div>

      <!-- Stage card area (spans the whole trip, content swaps) -->
      <div id="stage-area" class="clip" data-start="3.2" data-duration="18.4" data-track-index="2">
        <div id="stage-card">
          <div id="stage-name">Angle Validator</div>
          <div id="stage-verb">Is this angle worth writing?</div>
          <div id="stage-output">Go · Pivot · Stop</div>
        </div>
      </div>

      <!-- Track + 8 stations + package (spans whole trip) -->
      <div id="track-area" class="clip" data-start="3.2" data-duration="18.4" data-track-index="3">
        <div id="track"></div>
        <div id="track-fill"></div>
        <div id="st1" class="station" style="left:160px">1</div>
        <div id="st2" class="station" style="left:389px">2</div>
        <div id="st3" class="station" style="left:617px">3</div>
        <div id="st4" class="station" style="left:846px">4</div>
        <div id="st5" class="station" style="left:1074px">5</div>
        <div id="st6" class="station" style="left:1303px">6</div>
        <div id="st7" class="station" style="left:1531px">7</div>
        <div id="st8" class="station" style="left:1760px">8</div>
        <div id="package">The Draft</div>
      </div>

      <!-- Outro -->
      <div id="outro" class="clip" data-start="21.6" data-duration="1.9" data-track-index="4">
        <div id="outro-claim">Fact-checked. On-voice.<br />Every channel.</div>
        <div id="outro-mark">GTM-360 · Content Engine</div>
        <div id="outro-tag">The Revenue Operating System</div>
      </div>

      <!-- Audio -->
      <audio id="bg-music" data-start="0" data-duration="23.5" data-track-index="10" data-volume="0.30" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-intro" data-start="1.2" data-duration="0.18" data-track-index="11" data-volume="0.6" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-arrive-1" data-start="3.6" data-duration="0.11" data-track-index="12" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-arrive-2" data-start="5.9" data-duration="0.11" data-track-index="12" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-arrive-3" data-start="8.2" data-duration="0.11" data-track-index="12" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-arrive-4" data-start="10.5" data-duration="0.11" data-track-index="12" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-arrive-5" data-start="12.8" data-duration="0.11" data-track-index="12" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-arrive-6" data-start="15.1" data-duration="0.18" data-track-index="12" data-volume="0.65" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-arrive-7" data-start="17.4" data-duration="0.11" data-track-index="12" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-arrive-8" data-start="19.7" data-duration="0.11" data-track-index="12" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-bell" data-start="21.9" data-duration="1.48" data-track-index="13" data-volume="0.7" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script>
      gsap.registerPlugin(TextPlugin);
      const tl = gsap.timeline({ paused: true });

      /* Station centers (x) — matches inline left: on station markers. */
      const stations = [160, 389, 617, 846, 1074, 1303, 1531, 1760];

      /* Per-station copy (accurate to workflow.ts) */
      const stageCopy = [
        { name: 'Angle Validator', verb: 'Is this angle worth writing?', output: 'Go · Pivot · Stop' },
        { name: 'Researcher', verb: 'Find the proof across 6+ sources', output: 'Evidence table — claims, sourced' },
        { name: 'Spec Builder', verb: 'Set the brief', output: 'Structure · register · proof mix' },
        { name: 'So-what Gate', verb: 'Is it burning right now?', output: 'Demand score — pass or kill' },
        { name: 'Proprietary POV', verb: 'Ask the Experience Layer', output: 'Proprietary POV · or "analytical"' },
        { name: 'Writer', verb: 'Write it in your voice', output: 'First draft' },
        { name: 'Editor', verb: 'Check every claim', output: 'Fact-checked · on-voice · scored' },
        { name: 'Ship', verb: 'Send it out', output: 'LinkedIn · Substack · X' },
      ];

      const $ = (id) => document.getElementById(id);
      const stationEls = ['st1','st2','st3','st4','st5','st6','st7','st8'].map($);

      /* Intro */
      tl.fromTo('#glow', { opacity: 0.35 }, { opacity: 1, duration: 2.2, ease: 'sine.out' }, 0);
      tl.fromTo('#eyebrow', { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.25);
      tl.fromTo('#title', { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.7);
      tl.fromTo('#subtitle', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 1.15);
      tl.fromTo(['#track','#track-fill','#package'], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 2.4);
      tl.fromTo(stationEls, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)', stagger: 0.06 }, 2.4);

      /* Package begins at station 1 */
      tl.set('#package', { x: stations[0] }, 0);

      /* Per-station trip */
      stageCopy.forEach((sc, i) => {
        const start = 3.2 + i * 2.3;
        // slide package to this station
        tl.to('#package', { x: stations[i], duration: 0.45, ease: 'power2.inOut' }, start + 0.1);
        // mark previous done, this active
        if (i > 0) tl.set(stationEls[i - 1], { className: 'station done' }, start);
        tl.set(stationEls[i], { className: 'station active' }, start + 0.05);
        tl.fromTo(stationEls[i], { scale: 0.8 }, { scale: 1, duration: 0.35, ease: 'back.out(1.8)' }, start + 0.05);
        // swap stage card copy
        tl.set('#stage-name', { text: sc.name }, start + 0.15);
        tl.set('#stage-verb', { text: sc.verb }, start + 0.15);
        tl.set('#stage-output', { text: sc.output }, start + 0.15);
        tl.fromTo('#stage-name', { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, start + 0.15);
        tl.fromTo('#stage-verb', { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, start + 0.28);
        tl.fromTo('#stage-output', { y: 10, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, start + 0.4);
        // track fill grows
        tl.to('#track-fill', { width: (i + 1) * (1660 / 8), duration: 0.5, ease: 'power2.inOut' }, start + 0.1);
      });

      /* Outro */
      tl.fromTo('#outro', { opacity: 0 }, { opacity: 1, duration: 0.55, ease: 'sine.out' }, 21.6);
      tl.fromTo('#outro-claim', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 21.9);
      tl.fromTo('#outro-mark', { scale: 1.06, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'power2.out' }, 22.2);
      tl.fromTo('#outro-tag', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 22.4);

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

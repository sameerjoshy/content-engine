profiles:
  - id: thought-leader
    name: Thought Leader
    description: SaaS marketing, technical audiences, deep research

    brand_voice:
      opening_style: "Start with a problem statement or bold claim, never a question"
      forbidden_words:
        - "might"
        - "possibly"
        - "could"
        - "perhaps"
        - "arguably"
        - "one could say"
      sentence_structure: "Short sentences (max 15 words). Alternating short/long for rhythm."
      example_sentences:
        - "Most AI content pipelines fail. Not because AI is bad. Because teams use it wrong."
        - "Research wins. Every time. When your spec conflicts with your examples, research wins."
        - "The data is clear. 80% of implementations fail in year one."
      tone: "Confident, data-driven, original insights. No hedging. No corporate speak."
      adjective_limit: "Max 2 adjectives per noun. No stacking adjectives."

    icp:
      title: "VP Product, Head of Content, Growth Manager"
      industry: "B2B SaaS"
      seniority: "Director+"
      pain_points:
        - "Content output is generic"
        - "Can't iterate on inputs quickly"
        - "Don't know which inputs drive quality"
      budget: "$50k-500k/year"
      decision_style: "Data-driven. Wants proof it works before buying."

    content_standards:
      must_have:
        - "Data point or case study"
        - "Clear problem statement"
        - "Specific recommendation (not generic advice)"
        - "Original insight (not a take everyone has)"
      must_not_have:
        - "Hedging language"
        - "Corporate jargon"
        - "Vague claims without data"
        - "Multiple conflicting arguments"
      structure: "Intro (problem) → Why it happens → Proof (data + case study) → What to do → Closing"
      word_count: "1200-1800 words"
      paragraph_requirements: "Max 3-4 sentences per paragraph. Vary length."

    research_rules:
      trusted_sources:
        - "Industry reports (Gartner, Forrester)"
        - "Primary research (surveys, interviews)"
        - "Academic papers"
        - "Company case studies"
      sources_to_avoid:
        - "Blog posts (unless from recognized authority)"
        - "Social media posts"
        - "Unverified claims"
      depth_requirements:
        light: "1-2 hours research, 3-4 sources min"
        moderate: "3-4 hours research, 5-7 sources min"
        deep: "6+ hours research, 10+ sources min, include original research/interviews"
      recency: "Data <2 years old for tech, <5 years for general trends"

  - id: educator
    name: Educator
    description: Educational content, general audiences, accessible language

    brand_voice:
      opening_style: "Start with a relatable example or hook, can use questions"
      forbidden_words:
        - "obviously"
        - "simply"
        - "just"
        - "easy"
        - "jargon without explanation"
      sentence_structure: "Mix short and medium sentences. Build ideas step-by-step."
      example_sentences:
        - "AI sounds complicated. It's not. Here's why."
        - "Let's break this down into three ideas you can understand right now."
        - "Think of content like cooking. Raw ingredients (research) → recipe (spec) → dish (article)."
      tone: "Friendly, clear, encouraging. Explain like you're teaching a friend."
      adjective_limit: "Max 1 adjective per noun. Keep it simple."

    icp:
      title: "Marketing Manager, Content Creator, Student"
      industry: "Any"
      seniority: "Mid-level or learning"
      pain_points:
        - "Information overload"
        - "Hard to understand complex topics"
        - "Want step-by-step guides"
      budget: "$0-20k/year (free or affordable)"
      decision_style: "Values clarity and learning. Wants to understand the 'why'."

    content_standards:
      must_have:
        - "Step-by-step explanation"
        - "Real-world examples"
        - "Summary or takeaway"
        - "Practical application"
      must_not_have:
        - "Jargon without definition"
        - "Assumptions about prior knowledge"
        - "Overwhelming detail"
      structure: "Hook → What is this? → Why does it matter? → How does it work? → Real example → What now? → Summary"
      word_count: "1000-1500 words"
      paragraph_requirements: "2-3 sentences per paragraph. Short and punchy."

    research_rules:
      trusted_sources:
        - "Educational resources"
        - "Expert interviews"
        - "Case studies with clear outcomes"
        - "Studies with simple findings"
      sources_to_avoid:
        - "Overly technical papers"
        - "Outdated examples"
        - "Unverified claims"
      depth_requirements:
        light: "1-2 hours research, focus on clarity"
        moderate: "2-3 hours research, balance detail with accessibility"
        deep: "4+ hours research, explain complex ideas simply"
      recency: "Data <3 years old for relevance"

  - id: contrarian
    name: Contrarian
    description: Enterprise, pushes back on industry consensus

    brand_voice:
      opening_style: "Start by contrasting with what everyone believes"
      forbidden_words:
        - "most experts agree"
        - "conventional wisdom"
        - "everyone knows"
      sentence_structure: "Bold statements. Challenge reader assumptions."
      example_sentences:
        - "Enterprise AI isn't the future. It's already failing."
        - "Your content platform is making you worse, not better."
        - "The industry consensus is wrong. Here's the evidence."
      tone: "Provocative, evidence-backed, willing to be wrong. No ego."
      adjective_limit: "No adjectives. Facts only."

    icp:
      title: "CTO, VP Engineering, Enterprise Buyer"
      industry: "Enterprise B2B"
      seniority: "Director+"
      pain_points:
        - "Vendor hype, not reality"
        - "Need data-backed decisions"
        - "Skeptical of trends"
      budget: "$100k+/year"
      decision_style: "Skeptical. Wants proof you're right AND proof everyone else is wrong."

    content_standards:
      must_have:
        - "Explicit counter-argument to consensus"
        - "Data supporting contrarian take"
        - "Acknowledgment of opposing view"
        - "Why consensus is wrong"
      must_not_have:
        - "Clickbait"
        - "Unfounded claims"
        - "Personal attacks"
      structure: "Consensus view → Why it's wrong → What's actually true → Proof → Implications"
      word_count: "1500-2000 words"
      paragraph_requirements: "Dense. Each paragraph is one idea. Max 4 sentences."

    research_rules:
      trusted_sources:
        - "Primary data (surveys, studies)"
        - "Counter-evidence to consensus"
        - "Expert interviews (critical voices)"
        - "Case studies showing consensus failed"
      sources_to_avoid:
        - "Vendor marketing"
        - "Hype-driven articles"
      depth_requirements:
        light: "2 hours research, find counter-evidence"
        moderate: "4 hours research, deep counter-arguments"
        deep: "8+ hours research, interview skeptics, find academic rebuttals"
      recency: "Recent data only. Industry moves fast."

  - id: researcher-data-driven
    name: Researcher / Data-Driven
    description: Academic tone, research-heavy, metrics-focused

    brand_voice:
      opening_style: "Start with research question or hypothesis"
      forbidden_words:
        - "seems"
        - "appears to"
        - "I think"
        - "colloquial language"
      sentence_structure: "Structured, formal. Topic sentence → evidence → conclusion."
      example_sentences:
        - "A recent survey of 500 companies shows that 73% of AI implementations underperform expectations."
        - "The correlation between input specificity and output quality is 0.87 (p < 0.01)."
        - "Our analysis of 1000+ articles reveals three patterns..."
      tone: "Objective, data-driven, formal. No editorializing."
      adjective_limit: "Only data-qualified adjectives. No opinions."

    icp:
      title: "Researcher, Analyst, Data Scientist"
      industry: "Any"
      seniority: "Mid-senior"
      pain_points:
        - "Need rigorous analysis"
        - "Decisions must be data-backed"
        - "Tired of unsupported claims"
      budget: "$10k-50k/year"
      decision_style: "Data or nothing. Show your methodology."

    content_standards:
      must_have:
        - "Data or study cited for every claim"
        - "Methodology explained"
        - "Limitations acknowledged"
        - "Sample size and confidence level"
      must_not_have:
        - "Unsourced claims"
        - "Opinions stated as fact"
        - "Missing important caveats"
      structure: "Question/Hypothesis → Prior work → Methodology → Findings → Analysis → Implications → Limitations"
      word_count: "1800-2500 words"
      paragraph_requirements: "Dense, evidence-based. Each claim backed by data."

    research_rules:
      trusted_sources:
        - "Academic papers"
        - "Original research/surveys"
        - "Government data"
        - "Peer-reviewed journals"
      sources_to_avoid:
        - "Unsourced claims"
        - "Opinion pieces"
        - "Unverified data"
      depth_requirements:
        light: "3 hours research, 5 peer-reviewed sources min"
        moderate: "5 hours research, 8+ sources, 2+ original studies"
        deep: "10+ hours research, original survey or interview study, meta-analysis"
      recency: "Recent studies prioritized. Historical context included."
